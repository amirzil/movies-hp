name: Sync IMDb Ratings

# Triggered by the app itself (see src/utils/imdbRatingsSync.js): on page
# load, if /imdbRatingsMeta/lastSyncDate is more than 30 days old, the client
# fires this workflow via a fine-grained token scoped to Actions read/write
# on this repo only — the actual IMDb cookie never leaves this workflow.
# Incremental: only pulls ratings newer than the last sync (see script), so
# a routine run is one lightweight GraphQL page, not all 800+ ratings.
# "Run workflow" here (or `gh workflow run sync-imdb-ratings.yml`) still
# works too, for an on-demand resync.
#
# The IMDb session cookie (IMDB_COOKIE secret) expires periodically — when a
# run fails, the app shows a banner (via the same client check reading this
# workflow's latest run status). To refresh: capture from a logged-in
# browser (DevTools → Network → a graphql request → Copy as cURL) and
# re-save with `gh secret set IMDB_COOKIE`.
on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Sync ratings from IMDb to Firebase
        run: node scripts/sync-imdb-ratings.mjs
        env:
          IMDB_COOKIE: ${{ secrets.IMDB_COOKIE }}
          IMDB_USER_ID: ${{ secrets.IMDB_USER_ID }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_DB_URL: https://movies-watchlist-hp-default-rtdb.firebaseio.com
